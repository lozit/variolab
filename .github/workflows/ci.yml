name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} — syntax + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check (php -l)
        run: |
          set -e
          find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/phpl.out 2>&1 \
            || { cat /tmp/phpl.out; exit 1; }
          grep -v '^No syntax errors' /tmp/phpl.out || true

      - name: Run PHPUnit
        run: composer run test

      # Surface CVE advisories on composer dependencies. Non-blocking : `composer audit`
      # exits non-zero on any advisory (including dev-deps that don't ship), and we
      # don't want a transitive low-severity CVE to block all releases. The output
      # stays visible in the run logs ; Dependabot (when enabled) is the continuous
      # signal. See SECURITY.md.
      - name: composer audit (CVE check, informational)
        if: matrix.php == '8.1'
        run: composer audit || true

  lint:
    name: WordPress Coding Standards (PHPCS)
    runs-on: ubuntu-latest
    # PHPCS is BLOCKING : the codebase is fully WPCS-clean as of v0.9.3 (relaxed
    # cosmetic rules on modern PHP idioms but every Security/SQL/i18n category
    # still strict). See phpcs.xml.dist for the rationale.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2, cs2pr

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-8.1-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.1-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS (annotated, blocking)
        run: ./vendor/bin/phpcs --standard=phpcs.xml.dist --report-full --report-checkstyle=/tmp/phpcs.xml

      - name: Annotate PR with PHPCS findings
        if: always()
        run: cs2pr --graceful-warnings /tmp/phpcs.xml || true

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    # Runs the same automated checks as the wordpress.org reviewers (plugin headers,
    # i18n, late-escaping, deprecated functions, internationalization, etc.). Must
    # stay green : a failure here is the same as a future wordpress.org rejection.
    #
    # Plugin Check scans the BUILT plugin folder (matching what would actually ship
    # in the .zip), not the raw repo — otherwise it flags every dev-only file
    # (.claude/, .github/, tests/, docs/, CLAUDE.md, composer.json…) which would
    # never reach a wp.org installer anyway.
    #
    # Why hand-rolled instead of `wordpress/plugin-check-action@v1` :
    #   The action runs `npm -g i @wordpress/env` (always latest) on every run, and
    #   @wordpress/env 11.8.0 (2026-06-04) regressed — `wp-env start` exits 0 WITHOUT
    #   bringing Docker up, so the check then fails with "Environment not initialized".
    #   The action's internal retry only fires on a non-zero exit, so the false
    #   success is never retried (it failed 4×/4 on 2026-06-12). We replicate the
    #   action's steps here so we can (a) PIN @wordpress/env to the last good 11.7.0
    #   and (b) VERIFY WordPress actually responds (`wp core version`) before checking.
    #   Revisit the pin once @wordpress/env ships a fix for the silent-start regression.
    env:
      # Codes we knowingly suppress, with rationale :
      #   - WordPress.WP.AlternativeFunctions.rand_*       : mt_rand/srand for variant pick (speed > crypto, see Cookie.php)
      #   - WordPress.WP.AlternativeFunctions.file_system_*: zip extraction streams + local-disk reads on plugin-controlled paths
      #   - WordPress.DB.DirectDatabaseQuery.*             : we own a custom table (wp_abtest_events), no WP API alternative
      #   - WordPress.DB.SlowDBQuery.*                     : intentional meta_query for experiment lookup
      #   - PluginCheck.Security.DirectDB.UnescapedDBParameter : false positive on $table from Schema::events_table()
      #   - WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound : we hook into core actions like `init`
      #   - trademarked_term : "wordpress" appears in descriptive copy, not the plugin name
      PLUGIN_SLUG: variolab-ab-testing
      WP_ENV_VERSION: '11.7.0'
      IGNORE_CODES: 'WordPress.WP.AlternativeFunctions.rand_seeding_mt_srand,WordPress.WP.AlternativeFunctions.rand_mt_rand,WordPress.WP.AlternativeFunctions.file_system_operations_fopen,WordPress.WP.AlternativeFunctions.file_system_operations_fclose,WordPress.WP.AlternativeFunctions.file_system_operations_fwrite,WordPress.WP.AlternativeFunctions.file_system_operations_fread,WordPress.WP.AlternativeFunctions.file_system_operations_feof,WordPress.WP.AlternativeFunctions.file_system_operations_file_put_contents,WordPress.WP.AlternativeFunctions.file_get_contents_file_get_contents,WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching,WordPress.DB.DirectDatabaseQuery.SchemaChange,WordPress.DB.SlowDBQuery.slow_db_query_meta_query,WordPress.DB.SlowDBQuery.slow_db_query_meta_key,WordPress.DB.SlowDBQuery.slow_db_query_meta_value,PluginCheck.Security.DirectDB.UnescapedDBParameter,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,trademarked_term'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build plugin folder (mirrors release.yml's rsync)
        # Same exclusion list as release.yml so what we scan = what ships.
        # If you update one, update the other.
        run: |
          mkdir -p build/variolab-ab-testing
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.wordpress-org' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='intake' \
            --exclude='PLAN.md' \
            --exclude='CHANGELOG.md' \
            --exclude='RELEASE.md' \
            --exclude='.groundrules.json' \
            --exclude='SECURITY.md' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.lock' \
            --exclude='*.dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='CLAUDE.md' \
            --exclude='.wp-env.json' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.distignore' \
            --exclude='.phpunit.result.cache' \
            --exclude='*.zip' \
            --exclude='test*.html' \
            --exclude='/tools/' \
            --exclude='wp-tests-config.php' \
            --exclude='phpunit.xml*' \
            --exclude='phpcs.xml*' \
            ./ build/variolab-ab-testing/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup wp-env (pinned) + Plugin Check plugin
        run: |
          PLUGIN_DIR=$(realpath ./build/variolab-ab-testing)
          # core:null => wp-env's bundled latest WP (same as the action for any
          # wp-version other than 'trunk'). The build folder is mapped in as the
          # plugin under test; the official plugin-check plugin runs the audit.
          cat > .wp-env.json <<EOF
          {
            "core": null,
            "plugins": [ "https://downloads.wordpress.org/plugin/plugin-check.zip" ],
            "mappings": { "wp-content/plugins/${PLUGIN_SLUG}": "${PLUGIN_DIR}" }
          }
          EOF
          cat .wp-env.json
          npm -g --no-fund i "@wordpress/env@${WP_ENV_VERSION}"
          wp-env --version

      - name: Start wp-env (verified, retry on silent failure)
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "::group::wp-env start (attempt ${attempt})"
            wp-env start --update || true
            echo "::endgroup::"
            # wp-env start can exit 0 without bringing Docker up (the 11.8 regression
            # and occasional cold-Docker races). Verify WordPress actually answers.
            if wp-env run cli wp core version; then
              echo "WordPress environment is up."
              ok=1
              break
            fi
            echo "Environment not ready — destroying and retrying."
            wp-env destroy --yes || true
            sleep 5
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::wp-env failed to start a working WordPress after 3 attempts"
            exit 1
          fi

      - name: Run Plugin Check
        run: |
          set -e
          wp-env run cli wp plugin activate "${PLUGIN_SLUG}"

          echo "::group::Plugin Check (raw output)"
          # stdout (the JSON report) -> pc.json ; stderr (wp-env chatter + any PHP
          # notices emitted while loading the plugin under test) -> pc.err, so it
          # never pollutes the JSON. Capture the real exit code: `wp plugin check`
          # returns 0 whether or not it finds anything, and non-zero ONLY when the
          # command itself fails — so a crash can't slip through as an empty file.
          set +e
          wp-env run cli wp plugin check "${PLUGIN_SLUG}" \
            --format=json \
            --ignore-codes="${IGNORE_CODES}" \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > pc.json 2> pc.err
          check_rc=$?
          set -e
          echo "--- stderr ---"; cat pc.err || true
          echo "--- stdout (pc.json) ---"; cat pc.json || true
          echo "::endgroup::"

          if [ "${check_rc}" != "0" ]; then
            echo "::error::wp plugin check failed to run (exit ${check_rc}) — see stderr above"
            exit 1
          fi

          # Pass/fail = the same rule the action applies: any ERROR-severity finding
          # fails the job (warnings stay informational). An empty pc.json here means
          # zero findings (clean), since the command exited 0 above. Tolerant of any
          # leading/trailing chatter and of array- vs file-keyed JSON shapes.
          node -e '
            const fs = require("fs");
            let raw = fs.readFileSync("pc.json", "utf8");
            const a = raw.search(/[\[{]/);
            const b = Math.max(raw.lastIndexOf("]"), raw.lastIndexOf("}"));
            if (a === -1 || b < a) {
              console.log("No JSON payload — treating as no findings.");
              process.exit(0);
            }
            let data;
            try { data = JSON.parse(raw.slice(a, b + 1)); }
            catch (e) { console.error("Could not parse Plugin Check JSON:", e.message); process.exit(1); }
            let findings = [];
            if (Array.isArray(data)) findings = data;
            else for (const k of Object.keys(data)) if (Array.isArray(data[k])) findings = findings.concat(data[k]);
            const errors = findings.filter(f => String(f.type || "").toUpperCase() === "ERROR");
            console.log("Plugin Check: " + findings.length + " finding(s), " + errors.length + " error(s).");
            for (const e of errors) console.log("  ERROR " + (e.code || "") + " " + (e.file || "") + ":" + (e.line || "") + " " + (e.message || ""));
            process.exit(errors.length > 0 ? 1 : 0);
          '
